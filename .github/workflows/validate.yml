name: Validate
on:
  push:
  pull_request:

jobs:
  states:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2 pyyaml
      - name: Render Salt states and validate YAML
        run: python scripts/validate_states.py
